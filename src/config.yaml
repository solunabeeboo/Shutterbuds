site:
  name: Shutterbuds
  site: 'https://solunabeeboo.github.io'
  base: '/Shutterbuds'
  trailingSlash: false


# Default SEO metadata
metadata:
  title:
    default: 'Shutterbuds — Race to 1000'
    template: '%s — Shutterbuds'
  description: 'Post your in-game photos with #Shutterbuds. Hit 1000 together and everyone who entered unlocks a prize.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: Shutterbuds
    images:
      - url: '~/assets/images/shutterbuds/keyart.jpg'
        width: 1232
        height: 706
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'light:only' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
